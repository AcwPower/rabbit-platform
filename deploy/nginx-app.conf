# New application host 43.161.232.10. TLS is pinned by the gateway.
server {
    listen 443 ssl;
    server_name rabbit-backend.internal;
    ssl_certificate /etc/rabbit/tls/backend.crt;
    ssl_certificate_key /etc/rabbit/tls/backend.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    allow 10.5.0.8;
    allow 43.161.217.238;
    allow 127.0.0.1;
    deny all;
    root /opt/rabbit-platform/current/public;
    client_max_body_size 6m;
    access_log /var/log/nginx/rabbit-access.log;
    error_log /var/log/nginx/rabbit-error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location ^~ /party/api/ {
        proxy_pass http://127.0.0.1:8101/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_real_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }
    location ^~ /party/assets/ {
        try_files $uri =404;
        expires 30d;
    }
    location /party/ {
        try_files $uri $uri/ /party/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    }
    location / { return 404; }
}
