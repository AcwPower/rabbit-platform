# Include only in mushroom-king-timer.online HTTPS server.
location = /party { return 301 /party/; }
location ^~ /party/ {
    proxy_pass https://43.161.232.10;
    proxy_ssl_server_name on;
    proxy_ssl_name rabbit-backend.internal;
    proxy_ssl_trusted_certificate /etc/nginx/rabbit-backend.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_http_version 1.1;
    proxy_set_header Host rabbit-backend.internal;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie "rabbit_session=$cookie_rabbit_session";
    client_max_body_size 6m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 35s;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
}
